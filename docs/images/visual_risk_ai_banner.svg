<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Accent Glows -->
    <radialGradient id="cyanGlow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleGlow" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="380" fill="#020617"/>
  <rect width="1200" height="380" fill="url(#bgGrad)"/>
  <rect width="1200" height="380" fill="url(#cyanGlow)"/>
  <rect width="1200" height="380" fill="url(#purpleGlow)"/>

  <!-- Background Decorative Curves (Monte Carlo Visual Curves) -->
  <g opacity="0.35">
    <path d="M 0 300 C 300 280, 500 220, 800 180 C 1000 150, 1100 100, 1200 80" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4"/>
    <path d="M 0 320 C 350 300, 600 260, 900 210 C 1050 180, 1150 140, 1200 120" fill="none" stroke="#818cf8" stroke-width="3"/>
    <path d="M 0 340 C 400 330, 700 310, 950 280 C 1100 260, 1150 240, 1200 220" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="6,6"/>
    <!-- Shaded percentile band -->
    <path d="M 0 300 C 300 280, 500 220, 800 180 C 1000 150, 1100 100, 1200 80 L 1200 220 C 1150 240, 1100 260, 950 280 C 700 310, 400 330, 0 340 Z" fill="#38bdf8" opacity="0.05"/>
  </g>

  <!-- Official Brand Logo (Apple Blue Squircle with GaugeCircle) -->
  <g transform="translate(80, 70)">
    <rect width="120" height="120" rx="30" fill="#0071E3" opacity="0.95"/>
    <rect width="120" height="120" rx="30" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.5"/>
    <g transform="translate(24, 24) scale(3)">
      <path d="M15.6 2.7a10 10 0 1 0 5.7 5.7" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="12" cy="12" r="2" fill="#ffffff"/>
      <path d="M13.4 10.6 19 5" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Typography & Brand Titles -->
  <g transform="translate(230, 60)">
    <!-- Top Micro Tag -->
    <rect x="0" y="5" width="245" height="26" rx="13" fill="#1e293b" stroke="#0071E3" stroke-width="1.2"/>
    <g transform="translate(10, 9) scale(0.75)">
      <path d="M15.6 2.7a10 10 0 1 0 5.7 5.7" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="12" cy="12" r="2" fill="#38bdf8"/>
      <path d="M13.4 10.6 19 5" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="34" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#93c5fd" letter-spacing="1.2">ENTERPRISE TWIN ENGINE</text>

    <!-- Main Title -->
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="900" fill="url(#titleGrad)" letter-spacing="-1">Visual Risk AI</text>

    <!-- Full Subtitle -->
    <text x="0" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#cbd5e1" letter-spacing="0.2">AI-Based Visual Risk and Compliance Intelligence System</text>

    <text x="0" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8">Stochastic Trajectory Modeling · Circadian Biological Twins · Multi-Action Conversational Copilot</text>

    <!-- Pill Badges with Lucide Icons -->
    <g transform="translate(0, 180)">
      <!-- Badge 1: Monte Carlo (TrendingUp) -->
      <rect x="0" y="0" width="180" height="34" rx="17" fill="url(#cardBg)" stroke="#0284c7" stroke-width="1.2"/>
      <g transform="translate(12, 9) scale(0.666)">
        <polyline points="22 7 13.5 15.5 8.5 10.5 2 17" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <polyline points="16 7 22 7 22 13" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="34" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#7dd3fc">500-Run Monte Carlo</text>

      <!-- Badge 2: Agentic Reasoner (Bot/Cpu) -->
      <rect x="190" y="0" width="195" height="34" rx="17" fill="url(#cardBg)" stroke="#6366f1" stroke-width="1.2"/>
      <g transform="translate(202, 9) scale(0.666)">
        <rect width="18" height="18" x="3" y="3" rx="2" fill="none" stroke="#818cf8" stroke-width="2.5"/>
        <path d="M9 9h6v6H9z" fill="#818cf8"/>
      </g>
      <text x="224" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#c7d2fe">4-Stage Agentic Reasoner</text>

      <!-- Badge 3: Circadian Bio-Feedback (Activity) -->
      <rect x="395" y="0" width="185" height="34" rx="17" fill="url(#cardBg)" stroke="#059669" stroke-width="1.2"/>
      <g transform="translate(407, 9) scale(0.666)">
        <path d="M22 12h-4l-3 9L9 3l-3 9H2" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="429" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#6ee7b7">Circadian Bio-Feedback</text>

      <!-- Badge 4: React 19 + FastAPI (Layers) -->
      <rect x="590" y="0" width="170" height="34" rx="17" fill="url(#cardBg)" stroke="#9333ea" stroke-width="1.2"/>
      <g transform="translate(602, 9) scale(0.666)">
        <path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z" fill="none" stroke="#c084fc" stroke-width="2.5"/>
        <path d="m2 12 8.58 3.91a2 2 0 0 0 1.66 0L22 12" fill="none" stroke="#c084fc" stroke-width="2.5"/>
      </g>
      <text x="624" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e9d5ff">React 19 + FastAPI</text>

      <!-- Badge 5: 5 Personas (Users) -->
      <rect x="770" y="0" width="185" height="34" rx="17" fill="url(#cardBg)" stroke="#d97706" stroke-width="1.2"/>
      <g transform="translate(782, 9) scale(0.666)">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
        <circle cx="9" cy="7" r="4" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
        <path d="M22 21v-2a4 4 0 0 0-3-3.87" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
        <path d="M16 3.13a4 4 0 0 1 0 7.75" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
      </g>
      <text x="804" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#fcd34d">5 Life-Stage Personas</text>
    </g>
  </g>
</svg>
